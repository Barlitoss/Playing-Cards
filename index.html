<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="Playing Cards.css" />

</head>

<body>
    <main id="playing-cards">
        <div class="card card1">
            <div class="left"><span>A</span><br>♠</div>
            <div class="middle">♠</div>
            <div class="right"><span>A</span><br>♠</div>
        </div>
        <div class="card card2">
            <div class="left"><span>2</span><br>♥</div>
            <div class="middle">♥</div>
            <div class="middle">♥</div>
            <div class="right"><span>2</span><br>♥</div>
        </div>
        <div class="card card3">
            <div class="left"><span>3</span><br>♣</div>
            <div class="middle">♣</div>
            <div class="middle">♣</div>
            <div class="middle-flip">♣</div>
            <div class="right"><span>3</span><br>♣</div>
        </div>
    </main>

</body>

</html>
